<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顧客顯示端 - 勝芳商行</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 隱藏捲軸但保留滾動功能 */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden select-none">
    
    <!-- 頂部標題 -->
    <header class="bg-blue-800 text-white text-center py-4 shadow-md">
        <h1 class="text-4xl font-black tracking-widest">歡迎光臨 勝芳商行</h1>
    </header>

    <div class="flex-1 flex flex-col md:flex-row p-6 gap-6 h-full overflow-hidden">
        
        <!-- 左側：購物車明細 -->
        <div class="w-full md:w-2/3 bg-white rounded-2xl shadow-lg border-4 border-gray-200 flex flex-col overflow-hidden">
            <div class="bg-gray-100 py-3 px-6 border-b-2 border-gray-200">
                <h2 class="text-3xl font-bold text-gray-700">🛒 您的購買明細</h2>
            </div>
            
            <!-- 購物車列表容器 -->
            <div id="customer-cart-list" class="flex-1 overflow-y-auto p-4 bg-gray-50">
                <!-- 預設歡迎畫面 -->
                <div class="h-full flex flex-col items-center justify-center text-gray-400 opacity-50">
                    <svg class="w-48 h-48 mb-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                    <p class="text-4xl font-bold">請將商品交給櫃檯人員</p>
                </div>
            </div>
        </div>

        <!-- 右側：總計與找零資訊 -->
        <div class="w-full md:w-1/3 flex flex-col gap-6">
            
            <!-- 總金額顯示區 -->
            <div class="bg-white rounded-2xl shadow-lg border-4 border-gray-200 p-6 flex-1 flex flex-col justify-center items-center">
                <p id="customer-total-label" class="text-3xl font-bold text-gray-500 mb-2">應付總額</p>
                <p id="customer-total-amount" class="text-7xl font-black text-blue-700">$0</p>
            </div>

            <!-- 大大的找零提示區 (預設隱藏) -->
            <div id="customer-change-modal" class="hidden bg-green-500 rounded-2xl shadow-lg border-4 border-green-600 p-6 flex-1 flex flex-col justify-center items-center animate-pulse">
                <p class="text-3xl font-bold text-green-100 mb-2">請確認找零</p>
                <p id="customer-change-amount" class="text-7xl font-black text-white">$0</p>
                <p class="text-2xl font-bold text-green-100 mt-4">謝謝光臨，歡迎下次再來！</p>
            </div>
            
        </div>
    </div>

    <!-- 載入顧客端專屬的邏輯 -->
    <script src="js/customer.js"></script>
</body>
</html>
