    <!-- 🚀 註冊 PWA Service Worker (具備強制更新與自動重整機制) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => {
                        console.log('[系統] PWA 離線引擎註冊成功:', reg.scope);

                        // 每次載入時，強制請瀏覽器去伺服器檢查 service-worker.js 有沒有更新
                        reg.update();
                    })
                    .catch(err => console.error('[系統] PWA 註冊失敗:', err));
            });

            // 🚀 核心防呆：監聽 Service Worker 的控制權轉移
            // 當發現新的 Service Worker 接管時 (代表 cache 已經更新完成)
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (refreshing) return;
                refreshing = true;
                console.warn('[系統] 偵測到系統核心更新，正在重新載入最新版本...');
                // 強制重新整理頁面，確保長輩使用的是最新版的 JS 邏輯
                window.location.reload();
            });
        }
    </script>

            <div class="p-8 overflow-y-auto flex-1 bg-gray-50">
               <!-- 🚀 終極整合版：條碼搜尋與雲端工具區 -->
                <div class="flex flex-col mb-8 bg-purple-100 p-4 rounded-xl space-y-4">
                    
                    <!-- 搜尋與按鈕列 -->
                    <div class="flex flex-wrap gap-4 items-center">
                        <input type="text" id="input-prod-barcode" class="flex-1 min-w-[200px] border-2 border-purple-300 p-4 rounded-xl text-2xl font-bold focus:outline-none focus:border-purple-600 uppercase" placeholder="請掃描或輸入商品條碼...">
                        
                        <!-- 相機按鈕 -->
                        <button id="btn-camera-scan" class="bg-blue-600 text-white px-6 py-4 rounded-xl text-xl font-bold hover:bg-blue-700 shadow-md whitespace-nowrap">📷 鏡頭</button>
                        
                        <!-- 搜尋按鈕 -->
                        <button id="btn-search-product" class="bg-purple-600 text-white px-8 py-4 rounded-xl text-xl font-bold hover:bg-purple-700 shadow-md whitespace-nowrap">🔍 讀取</button>
                        
                        <!-- 雲端同步按鈕 -->
                        <button id="btn-sync-cloud" class="bg-indigo-600 text-white px-6 py-4 rounded-xl text-xl font-bold hover:bg-indigo-700 shadow-md transition-colors flex items-center whitespace-nowrap">
                            <span id="sync-icon" class="mr-2">☁️</span> 下載最新商品
                        </button>
                    </div>
                    
                    <!-- 📷 相機畫面預覽區 (預設隱藏) -->
                    <div id="camera-reader-container" class="hidden flex-col items-center bg-black rounded-xl overflow-hidden w-full max-w-md mx-auto">
                        <div id="camera-reader" class="w-full h-64"></div>
                        <button id="btn-stop-camera" class="w-full bg-red-600 text-white py-3 text-xl font-bold hover:bg-red-700">停止掃描</button>
                    </div>
                </div>
                
                <!-- 🚀 補回遺失的左右雙欄 Grid 排版容器 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    
                    <!-- 左欄：基本資料區 -->
                    <div class="space-y-4">
                        <h3 class="text-2xl font-bold text-gray-700 border-b-2 border-gray-200 pb-2">📝 基本資料</h3>
                        <div>
                            <label class="block text-gray-600 text-lg font-bold mb-1">商品名稱 (必填)</label>
                            <input type="text" id="input-prod-name" class="w-full border-2 border-gray-300 p-3 rounded-lg text-2xl font-bold focus:border-purple-500">
                        </div>
                        <div>
                            <label class="block text-gray-600 text-lg font-bold mb-1">進貨/廠商定義名稱</label>
                            <input type="text" id="input-prod-supplier" class="w-full border-2 border-gray-300 p-3 rounded-lg text-xl focus:border-purple-500">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-gray-600 text-lg font-bold mb-1">進價成本</label>
                                <input type="number" id="input-prod-cost" class="w-full border-2 border-gray-300 p-3 rounded-lg text-2xl font-bold text-danger focus:border-purple-500">
                            </div>
                            <div>
                                <label class="block text-gray-600 text-lg font-bold mb-1">預設售價 (必填)</label>
                                <input type="number" id="input-prod-price" class="w-full border-2 border-gray-300 p-3 rounded-lg text-2xl font-bold text-success focus:border-purple-500">
                            </div>
                        </div>
                    </div>

                    <!-- 右欄：促銷設定區 -->
                    <div class="space-y-4 bg-white p-4 rounded-xl shadow-sm border-2 border-dashed border-gray-300">
                        <h3 class="text-2xl font-bold text-gray-700 border-b-2 border-gray-200 pb-2">🏷️ 促銷條件設定</h3>
                        
                        <!-- 多重優惠計算方式 -->
                        <div class="mb-4 bg-purple-50 p-3 rounded-lg border-2 border-purple-200">
                            <label class="block text-purple-800 text-lg font-bold mb-1">多重優惠計算方式</label>
                            <select id="select-promo-strategy" class="w-full border-2 border-purple-300 p-2 rounded-lg text-xl bg-white focus:border-purple-500 font-bold">
                                <option value="BEST">擇優計算 (系統自動取最便宜)</option>
                                <option value="STACK">合併計算 (優惠一與二疊加折抵)</option>
                            </select>
                        </div>
                        
                        <!-- 優惠一 -->
                        <div class="space-y-2">
                            <label class="block text-gray-800 text-lg font-bold">優惠一</label>
                            <select id="select-promo1-type" class="w-full border-2 border-gray-300 p-2 rounded-lg text-xl bg-gray-50">
                                <option value="NONE">無優惠</option>
                                <option value="QTY_PRICE">滿件特價 (例: 3件100元)</option>
                                <option value="QTY_DISCOUNT">滿件打折 (例: 2件8折)</option>
                            </select>
                            <div class="flex space-x-2">
                                <input type="number" id="input-promo1-qty" placeholder="滿幾件" class="w-1/2 border-2 border-gray-300 p-2 rounded-lg text-lg font-bold">
                                <input type="number" id="input-promo1-val" placeholder="特價/折數(例:85或5)" class="w-1/2 border-2 border-gray-300 p-2 rounded-lg text-lg font-bold">
                            </div>
                        </div>

                        <!-- 優惠二 -->
                        <div class="space-y-2 pt-4 border-t-2 border-gray-100">
                            <label class="block text-gray-800 text-lg font-bold">優惠二</label>
                            <select id="select-promo2-type" class="w-full border-2 border-gray-300 p-2 rounded-lg text-xl bg-gray-50">
                                <option value="NONE">無優惠</option>
                                <option value="QTY_PRICE">滿件特價</option>
                                <option value="QTY_DISCOUNT">滿件打折</option>
                            </select>
                            <div class="flex space-x-2">
                                <input type="number" id="input-promo2-qty" placeholder="滿幾件" class="w-1/2 border-2 border-gray-300 p-2 rounded-lg text-lg font-bold">
                                <input type="number" id="input-promo2-val" placeholder="特價/折數(例:85或5)" class="w-1/2 border-2 border-gray-300 p-2 rounded-lg text-lg font-bold">
                            </div>
                        </div>
                    </div>
                </div> <!-- 結尾：雙欄 Grid -->
            </div> <!-- 結尾：內容滾動區 -->
            
            <!-- 底部按鈕區 (現在乖乖待在卡片內了！) -->
            <div class="bg-gray-100 p-6 flex space-x-4">
                <button id="btn-cancel-product" class="flex-1 bg-gray-300 text-gray-700 py-4 rounded-xl text-2xl font-bold hover:bg-gray-400 active:scale-95 transition-transform">取消</button>
                <button id="btn-save-product" class="flex-1 bg-purple-600 text-white py-4 rounded-xl text-2xl font-bold hover:bg-purple-700 shadow-md active:scale-95 transition-transform">💾 儲存商品設定</button>
            </div>
            
        </div>
    </div>
</body>

</html>
